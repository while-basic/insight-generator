[project]
name = "chat-recycler"
version = "0.1.0"
description = "Local-first ChatGPT export recycler for signals, variables, clustering, and prediction."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Chat Recycler"}]
dependencies = [
  "pydantic>=2.6",
  "pandas>=2.2",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "scikit-learn>=1.4",
  "numpy>=1.26",
  "flask>=3.0",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=2.6", "hdbscan>=0.8", "torch>=2.2"]
duckdb = ["duckdb>=0.10"]

[project.scripts]
chat-recycler = "chat_recycler.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
